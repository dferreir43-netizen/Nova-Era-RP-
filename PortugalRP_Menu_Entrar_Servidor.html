<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>PORTUGAL RP — Entrar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#09101c}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,5,14,.76),rgba(2,5,14,.25) 50%,rgba(2,5,14,.72)),linear-gradient(0deg,rgba(2,5,14,.62),transparent 50%,rgba(2,5,14,.38))}
.brand{position:absolute;top:7%;left:50%;transform:translateX(-50%);text-align:center;font-weight:1000;font-style:italic;line-height:.82;letter-spacing:-3px;font-size:clamp(42px,8vw,100px);text-shadow:0 5px 0 #111,0 0 24px #000;white-space:nowrap}
.brand span{display:block;color:#fff}.brand b{color:#ed1c2b}
.tag{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-size:clamp(9px,1.4vw,16px);font-weight:bold;letter-spacing:4px;text-shadow:0 2px 6px #000;white-space:nowrap}
.box{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:min(88vw,470px);padding:clamp(17px,3vw,28px);border:1px solid rgba(255,255,255,.25);border-radius:20px;background:rgba(4,9,19,.86);box-shadow:0 14px 50px #000a, inset 0 1px 0 #ffffff22;backdrop-filter:blur(8px);text-align:center}
.box h2{margin:0 0 16px;font-size:clamp(17px,2.4vw,24px);letter-spacing:1px}
select,input{width:100%;padding:14px 15px;margin:7px 0;border-radius:10px;border:1px solid #63718a;background:#101b2d;color:#fff;font-size:16px;outline:none}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:9px;font-size:clamp(15px,2vw,19px);font-weight:900;letter-spacing:.5px;cursor:pointer}
.login{background:linear-gradient(#f3c64b,#bd8117);color:#201504}
.play{background:linear-gradient(#39f34b,#078b20);color:#fff;border:2px solid #69ff78;box-shadow:0 0 22px #22f34d66;text-shadow:0 2px 3px #00480b}
.note{font-size:12px;color:#c4ccda;line-height:1.4;margin:12px 2px 0}
.status{min-height:18px;margin-top:10px;font-size:13px;color:#ffe08a}
.modal{display:none;position:absolute;inset:0;background:#000a;align-items:center;justify-content:center;padding:20px}
.modal-card{width:min(90vw,400px);padding:24px;border-radius:18px;background:#0b1424;border:1px solid #d4a53a;box-shadow:0 10px 50px #000;text-align:center}
.modal-card h3{margin:0 0 12px;color:#ffd45a}
.modal-card p{font-size:14px;line-height:1.5;color:#e1e6ef}
.close{background:#26354b;color:white}
@media (orientation:portrait){
 #app{width:100vh;height:100vw;transform:rotate(90deg);transform-origin:center center;position:absolute;left:50%;top:50%;margin-left:-50vh;margin-top:-50vw}
}
</style>
